name: Build
on:
  push:
    branches:
      - master
  pull_request: {}

jobs:
  linux-cabal:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ghc: ['9.6', '9.8', '9.10', '9.12']
        include:
          - cabal: latest
          - ghc: '8.6'
            cabal: '3.6'
          - ghc: '8.8'
            cabal: '3.6'
          - ghc: '8.10'
            cabal: '3.6'
      fail-fast: false
    steps:
    - uses: actions/checkout@v4
    - uses: actions/cache@v4.2.3
      name: Cache ~/.cabal/packages
      with:
        path: ~/.cabal/packages
        key: ${{ runner.os }}-${{ matrix.ghc }}-cabal-packages
    - uses: actions/cache@v4.2.3
      name: Cache ~/.cabal/store
      with:
        path: ~/.cabal/store
        key: ${{ runner.os }}-${{ matrix.ghc }}-cabal-store
    - uses: actions/cache@v4.2.3
      name: Cache dist-newstyle
      with:
        path: dist-newstyle
        key: ${{ runner.os }}-${{ matrix.ghc }}-dist-newstyle
    - uses: haskell-actions/setup@v2.7.11
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: ${{ matrix.cabal }}
    - name: Update cabal package database
      run: cabal update
    - name: Build
      run: |
        cabal build all
    - name: Test
      run: |
        cd opentelemetry
        cabal install tasty-discover
        env PATH="$HOME/.cabal/bin:$PATH" cabal test

  linux-stack:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack-yaml: ['stack-8.10.yaml', 'stack-9.8.yaml']
      fail-fast: false
    steps:
    - uses: actions/checkout@v4
    - uses: actions/cache@v4.2.3
      name: Cache ~/.stack
      with:
        path: ~/.stack
        key: ${{ runner.os }}-${{ matrix.stack-yaml }}-stack-home
    - name: Install stack
      run: which stack || curl -sSL https://get.haskellstack.org/ | sh
    - name: Install GHC
      run: |
        stack setup --stack-yaml ${{ matrix.stack-yaml }}
    - name: Build
      run: |
        stack build --no-interleaved-output --fast --stack-yaml ${{ matrix.stack-yaml }}
    - name: Test
      run: |
        stack test --fast --stack-yaml ${{ matrix.stack-yaml }}
    - name: Bench
      run: |
        stack bench --stack-yaml ${{ matrix.stack-yaml }} opentelemetry-extra --benchmark-arguments '+RTS -l'

  macos-stack:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macOS-latest
            stack-yaml: 'stack-9.8.yaml'
          - os: macOS-13
            stack-yaml: 'stack-8.10.yaml'
      fail-fast: false
    steps:
    - uses: actions/checkout@v4
    - uses: actions/cache@v4.2.3
      name: Cache ~/.stack
      with:
        path: ~/.stack
        key: ${{ runner.os }}-${{ matrix.stack-yaml }}-home-stack
    - name: Install stack
      run: which stack || curl -sSL https://get.haskellstack.org/ | sh
    - name: Install GHC
      run: |
        stack setup --stack-yaml ${{ matrix.stack-yaml }}
    - name: Build
      run: |
        stack build --no-interleaved-output  --fast --stack-yaml ${{ matrix.stack-yaml }}
    - name: Test
      run: |
        stack test --fast --stack-yaml ${{ matrix.stack-yaml }}
    - name: Bench
      run: |
        stack bench --stack-yaml ${{ matrix.stack-yaml }} opentelemetry-extra --benchmark-arguments '+RTS -l'

  win-cabal:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - ghc: '9.8'
            cabal: latest
          - ghc: '8.10'
            cabal: '3.8'
      fail-fast: false
    steps:
    - uses: actions/checkout@v4
    - uses: actions/cache@v4.2.3
      name: Cache ~/.cabal/packages
      with:
        path: ~/.cabal/packages
        key: ${{ runner.os }}-${{ matrix.ghc }}-cabal-packages
    - uses: actions/cache@v4.2.3
      name: Cache ~/.cabal/store
      with:
        path: ~/.cabal/store
        key: ${{ runner.os }}-${{ matrix.ghc }}-cabal-store
    - uses: actions/cache@v4.2.3
      name: Cache dist-newstyle
      with:
        path: dist-newstyle
        key: ${{ runner.os }}-${{ matrix.ghc }}-dist-newstyle
    - uses: haskell-actions/setup@v2.7.11
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: ${{ matrix.cabal }}
    - name: Update cabal package database
      run: cabal update
    - name: Build
      run: |
        cabal build all -v
